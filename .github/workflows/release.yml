name: 'Create Release'

on:
  push:
    branches:
      - master

env:
  # Compatibility package range: IDEA 2022.1 (build 221) through the last
  # build before the officially supported range (default since-build comes
  # from gradle.properties pluginSinceBuild). Keeping the range in env
  # avoids scattering magic numbers through the steps below.
  COMPAT_SINCE: '221'
  COMPAT_UNTIL: '251'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract_version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FULL_VERSION=""
          VERSION=$(echo "$COMMIT_MSG" | head -1 | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^v//')

          if [ -f "gradle.properties" ]; then
            FULL_VERSION=$(sed -n 's/^pluginBaseVersion=//p' gradle.properties | head -n1 | tr -d '\r' | xargs)
          fi

          if [ -z "$VERSION" ]; then
            if [ -z "$FULL_VERSION" ]; then
              echo "Error: No version found in gradle.properties"
              exit 1
            fi
            VERSION=$(echo "$FULL_VERSION" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          fi

          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v$VERSION"
          fi

          echo "Extracted version: $VERSION"
          echo "Full version: $FULL_VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git tag -l "${{ steps.extract_version.outputs.version }}" | grep -q "${{ steps.extract_version.outputs.version }}"; then
            echo "Tag ${{ steps.extract_version.outputs.version }} already exists. Skipping release creation."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Tag ${{ steps.extract_version.outputs.version }} does not exist. Proceeding with release creation."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK
        if: steps.check_tag.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Build Plugin
        if: steps.check_tag.outputs.skip == 'false'
        run: ./gradlew buildPlugin

      - name: Build Compatibility Package
        # Single best-effort package covering IDEA 2022.1 through the build
        # before the officially supported range. It is still compiled against
        # the newest platform (see build.gradle.kts) — only the declared
        # compatibility range changes — so runtime behaviour on older IDEs
        # is NOT verified. Best-effort means a failure here must not block
        # the release; only the default package is required.
        if: steps.check_tag.outputs.skip == 'false'
        run: |
          echo "Building compatibility package for IDEA build ${COMPAT_SINCE}-${COMPAT_UNTIL}"
          ./gradlew buildPlugin -PpluginSinceBuild="$COMPAT_SINCE" -PpluginUntilBuild="$COMPAT_UNTIL" \
            || echo "::warning::Compatibility build failed — releasing the default package only"

      - name: Generate Release Notes
        if: steps.check_tag.outputs.skip == 'false'
        id: generate_notes
        run: |
          # Get the previous tag (if any)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG=${{ steps.extract_version.outputs.version }}
          
          # Generate the release notes
          if [ -n "$PREV_TAG" ]; then
            NOTES="**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}\n\n"
            COMMITS=$(git log --pretty=format:"* %s" $PREV_TAG..HEAD | grep -E '^\* (refactor|feat|fix|perf|docs)' || true)
          else
            NOTES="**Initial Release**\n\n"
            COMMITS=$(git log --pretty=format:"* %s" | grep -E '^\* (refactor|feat|fix|perf|docs)' || true)
          fi
          
          # Add commit messages
          if [ -n "$COMMITS" ]; then
            NOTES="${NOTES}### Changes\n${COMMITS}\n\n"
          fi

          # Add the plugin support table — one row per built package.
          # Version format <base>.<since>.<until|0> embeds the range; "0"
          # means unbounded. Translate build numbers to product versions
          # (243 -> 2024.3, 252 -> 2025.2).
          NOTES="${NOTES}---\n\n"
          NOTES="${NOTES}### Downloads\n\n"
          NOTES="${NOTES}| Plugin | IDE Support |\n"
          NOTES="${NOTES}| ------ | ----------- |\n"
          DEFAULT_SINCE=$(sed -n 's/^pluginSinceBuild=//p' gradle.properties | head -n1 | tr -d '[:space:]')
          build_to_product() {
            local b="${1%%.*}"
            echo "20${b:0:2}.${b:2:1}"
          }
          for zip in $(ls build/distributions/easy-yapi-*.zip | sort -r); do
            ver=$(basename "$zip" .zip)
            ver="${ver#easy-yapi-}"
            since=$(echo "$ver" | cut -d. -f4)
            until=$(echo "$ver" | cut -d. -f5)
            if [[ "$until" == "0" ]]; then
              range_label="IntelliJ IDEA $(build_to_product "$since")+"
            else
              range_label="IntelliJ IDEA $(build_to_product "$since") – $(build_to_product "$until")"
            fi
            if [[ "$since" == "$DEFAULT_SINCE" ]]; then
              support="officially supported"
            else
              support="best-effort: compiled against the newest platform, not verified on older IDEs — see README to build other ranges"
            fi
            NOTES="${NOTES}| [easy-yapi-${ver}.zip](https://github.com/${{ github.repository }}/releases/download/${CURRENT_TAG}/easy-yapi-${ver}.zip) | ${range_label} (${support}) |\n"
          done
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: contains(github.event.head_commit.message, 'release') && steps.check_tag.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.extract_version.outputs.version }}
          name: ${{ steps.extract_version.outputs.version }}
          body: ${{ steps.generate_notes.outputs.notes }}
          draft: true
          prerelease: true
          files: |
            build/distributions/easy-yapi-*.zip
