name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check-labels.outputs.should-skip }}
    steps:
      - id: check-labels
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const docLabel = labels.data.find(label => label.name === 'type: doc');
            if (docLabel) {
              console.log('PR has type: doc label, skipping CI');
              return core.setOutput('should-skip', 'true');
            }
            
            const releaseLabel = labels.data.find(label => label.name === 'release');
            if (releaseLabel) {
              console.log('PR has release label, skipping CI');
              return core.setOutput('should-skip', 'true');
            }
            
            console.log('PR has no skip labels, continuing with CI');
            return core.setOutput('should-skip', 'false');

  build-test:
    needs: check-skip
    if: ${{ github.event_name != 'pull_request' || (needs.check-skip.outputs.should-skip != 'true' && !startsWith(github.head_ref || '', 'release/')) }}
    name: "Unit Test On ${{ matrix.os }} - jdk${{ matrix.java-version }}"
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        java-version: [17, 21]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: |
            17
            ${{ matrix.java-version }}
          distribution: 'zulu'
          cache: gradle

      - name: test
        run: ./gradlew test --stacktrace

      - name: package plugin
        run: ./gradlew buildPlugin --stacktrace

      - name: Cleanup Gradle Cache
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties

  verify-plugin:
    needs: check-skip
    if: ${{ github.event_name != 'pull_request' || (needs.check-skip.outputs.should-skip != 'true' && !startsWith(github.head_ref || '', 'release/')) }}
    name: "Plugin Verifier"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: verify plugin
        timeout-minutes: 60
        shell: bash
        # Keep the log outside build/: on a fresh checkout build/ does not exist
        # yet, so `tee build/...` fails before Gradle can create it, and pipefail
        # turns that into a bogus step failure.
        run: set -o pipefail && ./gradlew verifyPlugin --stacktrace 2>&1 | tee "$RUNNER_TEMP/verifier-stdout.log"

      # Release gate: the since-build IDE must report zero deprecated API usages.
      # Deprecations on newer IDEs are observation-only (next step); see .skills/compat-fixer/SKILL.md.
      - name: Check since-build deprecations
        if: always()
        run: |
          log="$RUNNER_TEMP/verifier-stdout.log"
          if [ ! -f "$log" ]; then echo "::error::Verifier log not found (verify plugin step did not run?)"; exit 1; fi
          since=$(sed -n 's/^pluginSinceBuild=//p' gradle.properties | head -1 | tr -d '[:space:]')
          if [ -z "$since" ]; then echo "::error::pluginSinceBuild not found in gradle.properties"; exit 1; fi

          # The verifier prints one summary line per IDE:
          #   Plugin <plugin>:<version> against <PRODUCT>-<build>: <verdict>
          # Asserting that at least one such line mentions the since-build keeps
          # this gate honest: without it, an "ides { recommended() }" set that no
          # longer covers the since-build would look identical to a clean result.
          verdicts=$(grep -E "^Plugin .* against [A-Z]+-${since}\.[0-9.]+: " "$log" || true)
          if [ -z "$verdicts" ]; then
            echo "::error::No verification result for since-build ${since}: the verifier matrix no longer covers it, so this gate proves nothing. See .skills/compat-fixer/SKILL.md"
            exit 1
          fi

          hits=$(printf '%s\n' "$verdicts" | grep -E "[1-9][0-9]* usage(s)? of deprecated API" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Deprecated API usages on the since-build IDE (${since}). Fix required before merge — see .skills/compat-fixer/SKILL.md"
            exit 1
          fi
          echo "since-build (${since}) has no deprecated API usages."

      - name: Surface deprecated API usages as warnings
        if: always()
        run: |
          reports=build/reports/pluginVerifier
          [ -d "$reports" ] || exit 0
          if grep -rqi "deprecat" "$reports"; then
            count=$(grep -rhi "deprecat" "$reports" | wc -l)
            echo "::warning::Deprecated API usages reported: ${count} line(s). See the plugin-verification-reports artifact."
            grep -rhi "deprecat" "$reports" | head -50
          else
            echo "No deprecated API usages reported."
          fi

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verification-reports
          path: build/reports/pluginVerifier
          if-no-files-found: ignore

      - name: Cleanup Gradle Cache
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
